# TASK 29 — Force LEANN daemon onto CPU so ComfyUI gets the GPU alone.
# Var names verified against this leann build's source:
#   embedding_compute.py:433 -> LEANN_EMBEDDING_DEVICE  (daemon embedding server)
#   chat.py:593              -> LEANN_LLM_DEVICE
# CUDA_VISIBLE_DEVICES="" is the belt: torch.cuda.is_available() -> False regardless.
[Service]
Environment="CUDA_VISIBLE_DEVICES="
Environment="LEANN_EMBEDDING_DEVICE=cpu"
Environment="LEANN_LLM_DEVICE=cpu"
# Thread caps: the inherited user-manager env pins OMP/MKL to 1 thread (a GPU-era
# setting). On CPU that single-threads the 8B embedding -> ~32s/query. The box has
# 32 cores; give the brief per-query embedding burst 16, leave 16 for ComfyUI's
# CPU-side work. Embedding is bursty (~seconds/query) so contention is negligible.
Environment="OMP_NUM_THREADS=16"
Environment="MKL_NUM_THREADS=16"
Environment="FAISS_NUM_THREADS=8"
