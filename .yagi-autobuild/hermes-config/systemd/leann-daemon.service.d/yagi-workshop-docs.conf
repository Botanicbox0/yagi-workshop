# TASK 32 — yagi-workshop-docs도 영구 daemon (--daemon-ttl 0)으로 띄워
# cold-start 17GB / 1-3분 / SIGABRT 경로 제거.
#
# ExecStartPost는 ExecStart(claude-chat-history daemon) 완료 후 실행.
# `bash -c '... &'`로 leann daemon을 백그라운드 spawn → bash 즉시 exit →
# ExecStartPost 정상 완료, spawned embedding server는 cgroup에서 계속 동작.
# sleep 10은 첫 daemon이 ZMQ 5557에 자리잡을 시간 확보 (Resource temporarily
# unavailable 회피).
[Service]
ExecStartPost=/bin/bash -c 'sleep 10; CUDA_VISIBLE_DEVICES= LEANN_EMBEDDING_DEVICE=cpu LEANN_LLM_DEVICE=cpu OMP_NUM_THREADS=16 MKL_NUM_THREADS=16 FAISS_NUM_THREADS=8 TORCHDYNAMO_DISABLE=1 /mnt/d/AI/leann-indexes/workspace/.venv/bin/leann daemon start yagi-workshop-docs --no-warmup --daemon-ttl 0 &'
